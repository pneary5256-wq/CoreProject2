<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicant Eligibility Analysis Tool</title>
    <meta
      name="description"
      content="Upload applicant data, review eligibility metrics, and inspect row-by-row rule outcomes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <p class="eyebrow">Applicant Eligibility Analysis Tool</p>
        <div class="page-header__actions">
          <label id="dropzone" class="toolbar-button toolbar-button--header toolbar-button--dropzone" for="csvInput">
            <input
              id="csvInput"
              type="file"
              accept=".csv,.tsv,.xls,.xlsx,.xlsm,.ods,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            />
            <span>Upload File (Drag and Drop)</span>
          </label>
          <button id="configureRulesButton" class="toolbar-button toolbar-button--header" type="button">
            Configure Rules
          </button>
          <button id="clearButton" class="ghost-button ghost-button--compact" type="button" disabled>
            Clear
          </button>
        </div>
      </header>

      <div id="message" class="message message--top" role="status" aria-live="polite">
        No file selected yet.
      </div>

      <section class="metrics-grid metrics-grid--five" aria-label="Eligibility metrics">
        <article class="metric-card metric-card--accent">
          <span class="metric-label">Total Applicants</span>
          <strong id="totalApplicantsCount">0</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Eligible</span>
          <strong id="eligibleCount">0</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Ineligible</span>
          <strong id="ineligibleCount">0</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Review Required</span>
          <strong id="reviewCount">0</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Missing Data</span>
          <strong id="missingDataCount">0</strong>
        </article>
      </section>

      <section class="dashboard" aria-label="Applicant review workspace">
        <article class="panel list-panel" aria-labelledby="applicants-title">
          <div class="panel-header panel-header--compact">
            <div>
              <p class="panel-kicker">Applicants</p>
              <h2 id="applicants-title">Applicant list</h2>
            </div>
            <div id="fileMeta" class="file-meta">Waiting for upload</div>
          </div>

          <div id="applicantList" class="applicant-list" role="list" aria-label="Applicants"></div>
        </article>

        <article class="panel details-panel" aria-labelledby="details-title">
          <div class="panel-header panel-header--compact">
            <div>
              <p class="panel-kicker">Details</p>
              <h2 id="details-title">Applicant details</h2>
            </div>
          </div>

          <div id="applicantDetails" class="applicant-details empty-state-panel">
            Select an applicant to inspect the criteria breakdown.
          </div>
        </article>
      </section>

      <section class="panel summary-panel" aria-labelledby="summary-title">
        <div class="panel-header panel-header--compact">
          <div>
            <p class="panel-kicker">Summary Output</p>
            <h2 id="summary-title">Summary Output</h2>
          </div>
          <button id="copySummaryButton" class="ghost-button" type="button" disabled>
            Copy
          </button>
        </div>

        <textarea
          id="summaryOutput"
          class="summary-output"
          rows="5"
          readonly
          placeholder="Summary output will appear here in a later step."
        ></textarea>
      </section>
    </main>
  </body>
</html>
